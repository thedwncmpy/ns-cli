name: CI

permissions:
  contents: read

on:
  push:
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Published release tag to update in Formula/ns.rb (example: v0.2.16)"
        required: true
        type: string

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh bash jq shellcheck python3 ruby
      - name: Syntax and lint
        run: |
          zsh -n lib/notion_cli.zsh
          zsh -n lib/common.zsh
          zsh -n lib/notion_api.zsh
          zsh -n lib/config.zsh
          zsh -n lib/relation_resolver.zsh
          zsh -n lib/migrations.zsh
          shellcheck -s bash tests/*.sh
      - name: Run contract tests
        run: |
          ./tests/test_slice1_router.sh
          ./tests/test_slice2_init.sh
          ./tests/test_slice3_link.sh
          ./tests/test_slice4_credentials.sh
          ./tests/test_slice5_upload.sh
          ./tests/test_slice6_download.sh
          ./tests/test_slice7_roundtrip_contract.sh
          ./tests/test_slice8_homebrew.sh
          ./tests/test_slice10_reliability.sh
          ./tests/test_slice11_p3.sh
          ./tests/test_slice12_status_completion.sh
          ./tests/test_slice13_bash_compat.sh

  bump-homebrew-formula:
    needs: test
    if: (github.event_name == 'release' && !github.event.release.prerelease) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: homebrew-formula-update
      cancel-in-progress: false
    steps:
      - name: Checkout source repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Update formula url/version/sha256
        id: formula
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.event.release.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ -z "${TAG}" ]]; then
            echo "Error: TAG is required. Provide workflow_dispatch input 'release_tag' (example: v0.1.9)."
            exit 1
          fi
          if [[ ! "$TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: TAG must be a stable version such as v0.2.16."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          FORMULA="Formula/ns.rb"
          TARBALL_URL="https://github.com/${REPO}/archive/refs/tags/${TAG}.tar.gz"
          SHA="$(curl -fsSL "$TARBALL_URL" | sha256sum | awk '{print $1}')"
          VERSION="${TAG#v}"

          TARBALL_URL="$TARBALL_URL" SHA="$SHA" VERSION="$VERSION" ruby - "$FORMULA" <<'RUBY'
          path = ARGV.fetch(0)
          formula = File.read(path)
          { "url" => ENV.fetch("TARBALL_URL"), "sha256" => ENV.fetch("SHA") }.each do |key, value|
            pattern = /^  #{key} ".*"$/
            abort "Missing or duplicate #{key} in #{path}" unless formula.scan(pattern).length == 1
            formula.sub!(pattern, "  #{key} \"#{value}\"")
          end
          formula.sub!(/^  version ".*"$/, "  version \"#{ENV.fetch('VERSION')}\"")
          File.write(path, formula)
          RUBY
          ruby -c "$FORMULA"

      - name: Create formula update pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.FORMULA_UPDATE_TOKEN || github.token }}
          commit-message: "chore: bump ns formula to ${{ steps.formula.outputs.tag }}"
          branch: "chore/bump-ns-${{ steps.formula.outputs.tag }}"
          title: "chore: bump ns to ${{ steps.formula.outputs.tag }}"
          body: |
            Updates the Homebrew formula to release `${{ steps.formula.outputs.tag }}` in `${{ github.repository }}`.
          add-paths: |
            Formula/ns.rb
